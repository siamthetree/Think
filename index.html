<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />

    <!-- iOS PWA + status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chinta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#090A0C" />

    <title>PaperPress - iPhone RSS Reader</title>
    <meta name="description" content="Minimalist, distraction-free iPhone RSS feed reader with offline reading, customizable tags, and clean newspaper reader view." />
    <meta property="og:title" content="PaperPress - iPhone RSS Reader" />
    <meta property="og:description" content="Minimalist, distraction-free iPhone RSS feed reader with offline reading, customizable tags, and clean newspaper reader view." />
    <meta property="og:type" content="website" />

    <!--
      Instant dark background before React mounts - no white flash on iPhone.
      This matches the splash-root background colour exactly.
    -->
    <style>
      html, body, #root {
        background: #090A0C !important;
        margin: 0; padding: 0;
        min-height: 100dvh;
        overflow: hidden;
      }
      /* Show only the loading placeholder until React hydrates */
      #pre-splash {
        position: fixed;
        inset: 0;
        background: #090A0C;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        transition: opacity 180ms ease;
      }
      #pre-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' https: http: data: blob:; media-src 'self' https: http: data: blob:; connect-src 'self' https: http:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';"
    />
  </head>

  <body class="bg-[#090A0C] text-neutral-100 antialiased">
    <!--
      Pre-hydration placeholder:
      Keeps screen non-blank during initial load before React mounts.
    -->
    <div id="pre-splash" aria-hidden="true"></div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
